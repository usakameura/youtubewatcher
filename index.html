<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube番組表</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#fbf8f1; --bg2:#fffdf8; --bg3:#f3eee3;
  --gold:#e29a00; --gold-ink:#9a6400;
  --line:rgba(60,45,20,.09); --line2:rgba(60,45,20,.17);
  --tx:#2b2620; --tx2:#6b6358; --tx3:#8a8174;
  --gutter:54px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:'Noto Sans JP',system-ui,sans-serif; font-size:14px; line-height:1.6;
  min-height:100vh;
  background-image:
    radial-gradient(1000px 500px at 15% -10%, rgba(226,154,0,.09), transparent 60%),
    linear-gradient(rgba(60,45,20,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(60,45,20,.035) 1px, transparent 1px);
  background-size:auto, 44px 44px, 44px 44px;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:40;background:rgba(251,248,241,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1600px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.06em;line-height:1;color:var(--gold-ink)}
.brand small{display:block;font-family:'Noto Sans JP';font-size:10px;letter-spacing:.18em;color:var(--tx3);margin-top:2px}
.clock{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.04em;line-height:1}
.clock span{font-size:12px;color:var(--tx2);font-family:'Noto Sans JP';margin-left:8px}
.sp{flex:1}
.btn{border:1px solid var(--line2);border-radius:8px;padding:7px 13px;font-size:12.5px;color:var(--tx2);transition:.15s}
.btn:hover{border-color:var(--gold);color:var(--gold-ink)}
.btn.pri{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:700}
.btn.pri:hover{filter:brightness(1.1);color:#1a1200}
.btn[disabled]{opacity:.45;cursor:default}
.zoom{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.zoom button{padding:7px 11px;font-size:12px;color:var(--tx2)}
.zoom button.on{background:var(--gold);color:#1a1200;font-weight:700}

/* remote */
.tabbar{max-width:1600px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tabnote{font-size:11.5px;color:var(--tx3)}
.remote{max-width:1600px;margin:0 auto;padding:12px 16px 4px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.rbtn{border:1px solid var(--line2);border-radius:7px;padding:6px 11px;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx2)}
.rbtn b{font-family:'Bebas Neue',sans-serif;font-size:17px;line-height:1}
.rbtn:hover{border-color:currentColor}

/* epg */
.wrap{max-width:1600px;margin:0 auto;padding:8px 16px 40px}
.epg{position:relative;overflow:auto;max-height:74vh;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.grid{display:grid;position:relative;min-width:1000px}
.corner{position:sticky;left:0;top:0;z-index:30;background:var(--bg3);border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.chh{position:sticky;top:0;z-index:20;background:var(--bg3);border-bottom:1px solid var(--line2);border-right:1px solid var(--line);padding:9px 10px}
.chh b{display:block;font-family:'Bebas Neue',sans-serif;font-size:18px;line-height:1}
.chh i{display:block;font-style:normal;font-size:12px;color:var(--tx);margin-top:1px}
.gut{position:sticky;left:0;z-index:15;background:var(--bg3);border-right:1px solid var(--line2)}
.gut .t{position:absolute;left:0;right:0;padding-left:7px;font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--tx3);letter-spacing:.03em;border-top:1px solid var(--line)}
.gut .t.hh{color:var(--tx2);border-top-color:var(--line2)}
.lane{position:relative;border-right:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,rgba(60,45,20,.06) 0 1px,transparent 1px var(--half))}
.blk{position:absolute;left:2px;right:2px;border-radius:6px;padding:4px 7px;overflow:hidden;cursor:pointer;text-align:left;display:block;border-left:3px solid;transition:filter .12s}
.blk:hover{filter:brightness(.95) saturate(1.4)}
.blk .ti{font-size:11.5px;line-height:1.3;color:var(--tx);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.blk .mt{font-size:10px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.h2 .ti{-webkit-line-clamp:2}
.blk.h1 .ti{-webkit-line-clamp:1}
.blk.h1 .mt{display:none}
.tag.bdl{background:rgba(60,45,20,.1);color:var(--tx)}
.blk.onair{box-shadow:inset 0 0 0 1px var(--gold)}
.blk.filler{cursor:default;border-left-color:var(--tx3);background:rgba(60,45,20,.035)}
.blk.filler:hover{filter:none}
.tag{display:inline-block;font-size:9px;font-weight:700;padding:0 4px;border-radius:3px;margin-right:4px;vertical-align:1px}
.tag.live{background:#ff3b30;color:#fff}
.tag.now{background:var(--gold);color:#1a1200}
.nl{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--gold);z-index:12;pointer-events:none}
.nl.g{z-index:18}
.nl.g::after{content:attr(data-t);position:absolute;left:3px;top:-8px;font-family:'Bebas Neue',sans-serif;font-size:12px;background:var(--gold);color:#1a1200;padding:0 4px;border-radius:3px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(43,38,32,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.md{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;box-shadow:0 18px 50px rgba(43,38,32,.18);width:100%;max-width:960px;max-height:92vh;overflow:auto}
.md-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.md-h h2{font-size:14px;font-weight:500;flex:1;line-height:1.4}
.vbox{position:relative;padding-top:56.25%;background:#000}
.vbox iframe,.vbox>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.md-b{padding:14px 16px}
.md-b .meta{color:var(--tx2);font-size:12px;margin-bottom:10px}
.zap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.err{background:rgba(255,59,48,.12);border:1px solid rgba(255,59,48,.4);color:#b3261e;padding:9px 12px;border-radius:8px;font-size:12px;margin-top:10px;display:none}
.err.on{display:block}

/* settings */
.set{max-width:620px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;color:var(--tx2);margin-bottom:4px}
.fld input[type=text],.fld input[type=password],.fld select{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;color:var(--tx);font-family:inherit;font-size:13px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--gold)}
.hint{font-size:11px;color:var(--tx3)}
.fld .hint{font-size:11px;color:var(--tx3);margin-top:4px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx)}
.status{padding:9px 16px;font-size:12px;color:var(--tx2);border-top:1px solid var(--line);min-height:36px}
.status.bad{color:#b3261e}
.sec{margin-bottom:20px}
.sec h3{font-size:13px;font-weight:500;color:var(--tx2);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row .rb{flex:1;min-width:0}
.row .rt{font-size:13px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rs{font-size:11px;color:var(--tx3);margin-top:2px}
.row .ra{flex-shrink:0;display:flex;gap:6px}
.row .btn{padding:5px 10px;font-size:11.5px}
.empty{font-size:12px;color:var(--tx3);padding:12px 0}
.tag.pre{background:#7b52d6;color:#fff}
.tag.fav{background:var(--gold);color:#1a1200}
.btn.on{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:700}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--gold);color:var(--tx);padding:11px 18px;border-radius:9px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:760px){
  :root{--gutter:42px}
  body{font-size:13px}
  .top-in{padding:9px 11px;gap:8px}
  .brand{font-size:20px}
  .brand small{font-size:8.5px;letter-spacing:.1em}
  .clock{font-size:17px}
  .clock span{font-size:11px;margin-left:5px}
  .btn{padding:6px 9px;font-size:11.5px}
  .zoom button{padding:6px 9px;font-size:11px}
  .tabbar{padding:9px 11px 0;gap:8px}
  .tabnote{font-size:10.5px;width:100%}
  .remote{padding:9px 11px 2px;gap:5px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .remote::-webkit-scrollbar{display:none}
  .rbtn{flex-shrink:0;padding:5px 9px}
  .rbtn b{font-size:15px}
  .wrap{padding:6px 11px 28px}
  .epg{max-height:72vh;border-radius:10px}
  .grid{min-width:720px}
  .chh{padding:7px 6px}
  .chh b{font-size:15px}
  .chh i{font-size:11px}
  .gut .t{font-size:12px;padding-left:5px}
  .blk{padding:3px 5px;left:1px;right:1px}
  .blk .ti{font-size:11px}
  .blk .mt{font-size:9.5px}
  .ov{padding:0}
  .md{max-width:100%;max-height:100vh;border-radius:0;border:0}
  .md-h{padding:11px 13px;position:sticky;top:0;background:var(--bg2);z-index:2}
  .md-b{padding:13px}
  .row{padding:10px 0}
  .row .rt{white-space:normal}
  .zap{gap:6px}
  .status{padding:9px 11px;font-size:11.5px}
}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <div class="brand">YOUTUBE GUIDE<small>ジャンル横断 24時間編成</small></div>
  <div class="clock" id="clock">--:--<span id="today"></span></div>
  <div class="sp"></div>
  <div class="zoom" id="zoom"></div>
  <button class="btn" id="btnNow">現在へ</button>
  <button class="btn" id="btnMy">予約・お気に入り</button>
  <button class="btn" id="btnSet">設定</button>
  <button class="btn pri" id="btnLoad">番組表を更新</button>
</div></div>

<div class="tabbar">
  <div class="zoom" id="tabs"></div>
  <span class="tabnote" id="tabnote"></span>
</div>
<div class="remote" id="remote"></div>
<div class="wrap">
  <div class="epg" id="epg"><div class="grid" id="grid"></div></div>
  <div class="status" id="status">番組表を読み込んでいます…</div>
</div>

<div class="ov" id="ovPlay"><div class="md">
  <div class="md-h">
    <h2 id="pTitle">-</h2>
    <button class="btn" id="pClose">閉じる</button>
  </div>
  <div class="vbox"><div id="ytplayer"></div></div>
  <div class="md-b">
    <div class="meta" id="pMeta"></div>
    <div class="zap">
      <button class="btn" id="zPrev">◀ 前のch</button>
      <button class="btn" id="zNext">次のch ▶</button>
      <button class="btn" id="pHead">最初から見る</button>
      <button class="btn" id="pFav">★ 番組</button>
      <button class="btn" id="pFavCh">★ チャンネル</button>
      <button class="btn" id="pRem">視聴予約</button>
      <span id="pNext" style="font-size:12px;color:var(--tx3)"></span>
    </div>
    <div class="err" id="pErr"></div>
  </div>
</div></div>

<div class="ov" id="ovMy"><div class="md">
  <div class="md-h"><h2>予約・お気に入り</h2><button class="btn" id="myClose">閉じる</button></div>
  <div class="md-b" id="myBody">
    <div class="sec"><h3>視聴予約</h3><div id="myRem"></div></div>
    <div class="sec"><h3>プレミア公開・配信予定</h3><div id="myUp"></div></div>
    <div class="sec"><h3>お気に入り</h3><div id="myFav"></div></div>
    <div class="fld">
      <label for="fLead">開始何分前に通知するか</label>
      <input type="text" id="fLead" style="width:90px">
    </div>
    <div class="hint" id="myNote"></div>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<div class="ov" id="ovSet"><div class="md set">
  <div class="md-h"><h2>設定</h2><button class="btn" id="sClose">閉じる</button></div>
  <div class="md-b">
    <div class="fld">
      <label for="fRegion">主な地域</label>
      <input type="text" id="fRegion">
      <div class="hint" id="hRegion"></div>
    </div>
    <div class="fld">
      <label for="fExtra">追加で混ぜる地域（カンマ区切り、任意）</label>
      <input type="text" id="fExtra" placeholder="US, KR, TW">
      <div class="hint">ライブ配信とプレミア公開は、主な地域のものだけ表示されます。</div>
    </div>
    <div class="fld">
      <label for="fLang">表示する言語</label>
      <select id="fLang"></select>
    </div>
    <div class="fld"><label class="chk"><input type="checkbox" id="fLangOnly"> 選んだ言語の動画だけ表示する</label>
      <div class="hint" id="hLang"></div>
    </div>
    <div class="hint">閉じると番組表に反映されます。</div>
  </div>
</div></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* ============================================================
   DEPLOY: Supabase の接続情報だけを持たせます。
   YouTube APIキーはEdge Function側にあり、ブラウザには一切出ません。
   ============================================================ */
var DEFAULTS = {
  region: 'JP',
  sbUrl: 'https://cbfwgnjsguhcobwejsaw.supabase.co',
  sbKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNiZndnbmpzZ3VoY29id2Vqc2F3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTI5OTMsImV4cCI6MjEwNDk2ODk5M30.8thai4K-_nkR-oXBtoqvjzqNRWsbOpSdNLGPp6OJfAo'
};

var CH = [
  { no:1, name:'音楽',     cats:['10'],            color:'#7b52d6' },
  { no:2, name:'ゲーム',   cats:['20'],            color:'#15875a' },
  { no:3, name:'学び',     cats:['27','28'],       color:'#c06a00' },
  { no:4, name:'ニュース', cats:['25'],            color:'#2f78cf' },
  { no:5, name:'エンタメ', cats:['24','23'],       color:'#cf3f7a' },
  { no:6, name:'スポーツ', cats:['17'],            color:'#3c8f3a' },
  { no:7, name:'くらし',   cats:['26','22','19'],  color:'#9c7600' },
  { no:8, name:'映像',     cats:['1','2','15'],    color:'#cc3f3f' }
];

var CAT2CH = {};
CH.forEach(function(c){ c.cats.forEach(function(k){ CAT2CH[k] = c.no; }); });

var MIN_SLOT = 600000;    /* 最小の番組枠。これを下回る枠は作らない＝タイトルが必ず入る */
var MAX_BUNDLE = 6;       /* 1枠にまとめるショート動画の上限本数 */
var ZOOMS = [2.2, 3.2, 4.6];

/* localStorage が使えない環境ではメモリに退避する */
var store = (function(){
  var mem = {}, ok = false;
  try {
    window.localStorage.setItem('__epg_t', '1');
    window.localStorage.removeItem('__epg_t');
    ok = true;
  } catch (e) { ok = false; }
  return {
    available: ok,
    get: function(k, d){
      try {
        var v = ok ? window.localStorage.getItem(k) : mem[k];
        return v == null ? d : JSON.parse(v);
      } catch (e) { return d; }
    },
    set: function(k, v){
      var t = JSON.stringify(v);
      try { if (ok) window.localStorage.setItem(k, t); else mem[k] = t; }
      catch (e) { mem[k] = t; }
    }
  };
})();

/* 端末の言語設定から国と言語を推定する */
function deviceLocale(){
  var tag = 'ja-JP';
  try { tag = (navigator.languages && navigator.languages[0]) || navigator.language || 'ja-JP'; }
  catch (e) { /* noop */ }
  var p = String(tag).split('-');
  var lang = (p[0] || 'ja').toLowerCase();
  var country = p.length > 1 ? p[p.length - 1].toUpperCase() : '';
  if (!/^[A-Z]{2}$/.test(country)){
    var m = { ja:'JP', ko:'KR', en:'US', zh:'TW', th:'TH', vi:'VN', id:'ID',
              fr:'FR', de:'DE', es:'ES', pt:'BR', it:'IT', ru:'RU', hi:'IN' };
    country = m[lang] || 'US';
  }
  return { lang: lang, country: country };
}
var DEV = deviceLocale();

/* 日本語かどうかの推定に使う。lang が未設定の動画が多いため文字種でも判定する */
var SCRIPT_RE = {
  ja: /[ぁ-んァ-ヶ]/,
  ko: /[가-힣]/,
  zh: /[\u4e00-\u9fff]/,
  th: /[\u0e00-\u0e7f]/,
  ru: /[А-Яа-я]/
};

var LANGS = [
  ['ja','日本語'], ['en','English'], ['ko','한국어'], ['zh','中文'], ['th','ไทย'],
  ['vi','Tiếng Việt'], ['id','Bahasa Indonesia'], ['fr','Français'], ['de','Deutsch'],
  ['es','Español'], ['pt','Português'], ['it','Italiano'], ['ru','Русский'], ['hi','हिन्दी']
];

var favVideos   = store.get('epg.favVideos', {});    /* videoId -> {title, channelTitle} */
var favChannels = store.get('epg.favChannels', {});  /* channelTitle -> 1 */
var reminders   = store.get('epg.reminders', []);    /* [{videoId,title,channelTitle,start,premiere,fired}] */
var leadMin     = store.get('epg.leadMin', 5);
var upcomingList = [];

var cfg = {
  sbUrl: DEFAULTS.sbUrl,
  sbKey: DEFAULTS.sbKey,
  region: store.get('epg.region', DEV.country),          /* 主地域 */
  extraRegions: store.get('epg.extraRegions', []),       /* 追加で混ぜる国 */
  langOnly: store.get('epg.langOnly', true),             /* 自国の言語のみ */
  lang: store.get('epg.lang', DEV.lang),
  view: store.get('epg.view', 'normal')     /* normal | kids */
};

var pxPerMin = (typeof window !== 'undefined' && window.innerWidth && window.innerWidth < 760)
  ? ZOOMS[1] : ZOOMS[0];
var schedule = {};      /* chNo -> blocks[] */
var flatBlocks = [];    /* 全番組（クリック参照用） */
var dayStart = 0, dayEnd = 0;
var editingBlockIdx = -1;   /* 再生中の番組インデックス（グローバル保持） */
var player = null, ytReady = false, pendingPlay = null;
var playTarget = null;   /* 再生中の動画（まとめ枠なら該当の1本） */
var lastRes = null;      /* 直近の取得結果。タブ切替で再取得しないため */

/* ============================================================
   ユーティリティ
   ============================================================ */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function mdhm(ms){
  var d = new Date(ms);
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function hhmm(ms){ var d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function mmss(sec){
  sec = Math.max(0, Math.round(sec));
  var h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return (h ? h + ':' + pad2(m) : m) + ':' + pad2(s);
}
function viewLabel(v){
  if (!v) return '';
  if (v >= 100000000) return (Math.round(v / 10000000) / 10) + '億回';
  if (v >= 10000) return Math.round(v / 10000) + '万回';
  return v + '回';
}
function durLabel(sec){
  var m = Math.round(sec/60);
  return m >= 60 ? Math.floor(m/60) + '時間' + (m%60 ? m%60 + '分' : '') : m + '分';
}
function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); }

/* ISO8601 duration -> 秒 */
function parseDur(iso){
  if (!iso) return 0;
  var m = /^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:([\d.]+)S)?)?$/.exec(iso);
  if (!m) return 0;
  return (+(m[1]||0))*86400 + (+(m[2]||0))*3600 + (+(m[3]||0))*60 + Math.round(+(m[4]||0));
}

/* 決定論的な擬似乱数（同じ日付なら誰が見ても同じ編成） */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedOf(str){
  var h = 2166136261;
  for (var i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shuffled(arr, seedStr){
  var out = arr.slice(), rnd = mulberry32(seedOf(seedStr));
  for (var i = out.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1));
    var tmp = out[i]; out[i] = out[j]; out[j] = tmp;
  }
  return out;
}

/* ============================================================
   編成ロジック（案C：ライブは実時間、残りを仮想枠で埋める）
   ============================================================ */
/* 時間帯の格付け。0=ゴールデン 1=準プライム 2=深夜早朝 */
function tierOfHour(h){
  if (h >= 19 && h < 23) return 0;
  if ((h >= 7 && h < 10) || (h >= 12 && h < 14) || (h >= 17 && h < 19) || h === 23) return 1;
  return 2;
}

/* 人気順に並べて3階層に割る。上位ほど良い時間帯に配置される */
function tierPools(pool, seedStr){
  var sorted = pool.slice().sort(function(a, b){
    var ra = (a.rank == null ? 9999 : a.rank), rb = (b.rank == null ? 9999 : b.rank);
    if (ra !== rb) return ra - rb;
    return (b.views || 0) - (a.views || 0);
  });
  if (sorted.length < 9){
    var all = shuffled(sorted, seedStr + '#all');
    return [all, all, all];
  }
  var a = Math.round(sorted.length * 0.30);
  var b = Math.round(sorted.length * 0.70);
  return [
    shuffled(sorted.slice(0, a), seedStr + '#t0'),
    shuffled(sorted.slice(a, b), seedStr + '#t1'),
    shuffled(sorted.slice(b),    seedStr + '#t2')
  ];
}

function buildLane(dStart, dEnd, lives, pool, seedStr){
  var blocks = [];

  /* 1. ライブを実時間で固定配置（重なりは先勝ち） */
  var fixed = [];
  lives.map(function(l){
    return {
      videoId: l.videoId, title: l.title, channelTitle: l.channelTitle,
      thumb: l.thumb, durSec: Math.round((l.end - l.start)/1000),
      start: Math.max(l.start, dStart), end: Math.min(l.end, dEnd), live: true
    };
  }).filter(function(l){
    return l.end - l.start >= MIN_SLOT;
  }).sort(function(a,b){
    return a.start - b.start;
  }).forEach(function(l){
    if (fixed.length && l.start < fixed[fixed.length-1].end) return;
    fixed.push(l);
  });

  /* 2. 空き時間を算出 */
  var gaps = [], cursor = dStart, i;
  for (i = 0; i < fixed.length; i++){
    if (fixed[i].start > cursor) gaps.push([cursor, fixed[i].start]);
    cursor = Math.max(cursor, fixed[i].end);
  }
  if (cursor < dEnd) gaps.push([cursor, dEnd]);

  /* 3. 時間帯に応じた階層から動画を引いて埋める */
  var tiers = tierPools(pool, seedStr);
  var cur = [0, 0, 0];
  function nextFrom(t){
    if (!tiers[t] || !tiers[t].length) return null;
    return tiers[t][cur[t]++ % tiers[t].length];
  }

  for (i = 0; i < gaps.length; i++){
    var gs = gaps[i][0], ge = gaps[i][1], t = gs, guard = 0, firstIdx = blocks.length;

    while (ge - t >= MIN_SLOT && guard++ < 3000){
      var tier = tierOfHour(new Date(t).getHours());
      var v = nextFrom(tier);
      if (!v) break;
      var remain = ge - t;

      if (v.durSec * 1000 < MIN_SLOT){
        /* 短尺はまとめて1枠にする。枠がMIN_SLOTを超えるまで詰める */
        var items = [], acc = 0, sub = t, g2 = 0, vv = v;
        while (vv && g2++ < MAX_BUNDLE){
          var d = vv.durSec * 1000;
          if (acc + d > remain) break;
          items.push({
            videoId: vv.videoId, title: vv.title, channelTitle: vv.channelTitle,
            durSec: vv.durSec, views: vv.views, start: sub, end: sub + d
          });
          acc += d; sub += d;
          if (acc >= MIN_SLOT) break;
          vv = nextFrom(tier);
        }
        if (!items.length) continue;
        blocks.push({
          bundle: true, items: items,
          videoId: items[0].videoId,
          title: items.length > 1
            ? items[0].title + ' ほか' + (items.length - 1) + '本'
            : items[0].title,
          channelTitle: items.length > 1 ? 'ショートセレクション' : items[0].channelTitle,
          views: items[0].views,
          durSec: Math.round(acc / 1000),
          start: t, end: t + acc, live: false
        });
        t += acc;
      } else {
        var dur = v.durSec * 1000, truncated = false;
        if (dur > remain){ dur = remain; truncated = true; }
        if (dur < MIN_SLOT) continue;
        blocks.push({
          videoId: v.videoId, title: v.title, channelTitle: v.channelTitle, thumb: v.thumb,
          durSec: v.durSec, views: v.views, start: t, end: t + dur,
          live: false, truncated: truncated
        });
        t += dur;
      }
    }

    /* 端数は前の番組を延ばして吸収する（細い枠を作らないため） */
    if (ge - t > 0){
      if (blocks.length > firstIdx && blocks[blocks.length-1].end === t){
        blocks[blocks.length-1].end = ge;
      } else {
        blocks.push({ videoId:null, title:'放送休止', channelTitle:'', thumb:'',
                      durSec:Math.round((ge-t)/1000), start:t, end:ge, live:false, filler:true });
      }
    }
  }

  return blocks.concat(fixed).sort(function(a,b){ return a.start - b.start; });
}

function buildSchedule(vids, lives, baseDate){
  dayStart = startOfDay(baseDate);
  dayEnd = dayStart + 86400000;
  var key = new Date(dayStart).getFullYear() + '-' + pad2(new Date(dayStart).getMonth()+1) + '-' + pad2(new Date(dayStart).getDate());
  var sch = {};
  CH.forEach(function(c){
    var pool = vids.filter(function(v){ return v.ch === c.no; });
    /* そのジャンルが1本も取れなかった場合は全体プールから借りる（丸一日「放送休止」を防ぐ） */
    if (pool.length < 3) pool = shuffled(vids, key + '#borrow' + c.no).slice(0, 60);
    var lv = lives.filter(function(v){ return v.ch === c.no; });
    sch[c.no] = buildLane(dayStart, dayEnd, lv, pool, key + '#' + c.no);
  });
  return sch;
}

/* ============================================================
   地域・言語の絞り込み
   ============================================================ */
function regionList(){
  var out = [cfg.region];
  for (var i = 0; i < cfg.extraRegions.length; i++){
    if (out.indexOf(cfg.extraRegions[i]) < 0) out.push(cfg.extraRegions[i]);
  }
  return out;
}

/* 動画が対象言語かどうか。lang が空の動画が多いので文字種でも推定する */
function matchesLang(v, code){
  var l = (v.lang || '').split('-')[0];
  if (l) return l === code;
  var re = SCRIPT_RE[code];
  if (re) return re.test(v.title || '');
  return true;   /* 推定手段が無い言語は落とさない */
}

function applyFilters(vids){
  var out = [], seen = {}, i, v;
  for (i = 0; i < vids.length; i++){
    v = vids[i];
    if (seen[v.videoId]) continue;
    if (cfg.view === 'kids'){ if (!v.kids) continue; }
    else if (v.kids) continue;
    if (cfg.langOnly && !matchesLang(v, cfg.lang)) continue;
    seen[v.videoId] = 1;
    out.push(v);
  }
  return out;
}

/* ============================================================
   お気に入り・視聴予約
   ============================================================ */
function saveFav(){
  store.set('epg.favVideos', favVideos);
  store.set('epg.favChannels', favChannels);
}
function saveRem(){ store.set('epg.reminders', reminders); }

function isFav(b){
  if (!b) return false;
  if (b.channelTitle && favChannels[b.channelTitle]) return true;
  if (b.videoId && favVideos[b.videoId]) return true;
  if (b.bundle && b.items){
    for (var i = 0; i < b.items.length; i++){
      if (favVideos[b.items[i].videoId]) return true;
      if (favChannels[b.items[i].channelTitle]) return true;
    }
  }
  return false;
}

function toggleFavVideo(v){
  if (!v || !v.videoId) return false;
  if (favVideos[v.videoId]) delete favVideos[v.videoId];
  else favVideos[v.videoId] = { title: v.title, channelTitle: v.channelTitle };
  saveFav();
  return !!favVideos[v.videoId];
}
function toggleFavChannel(name){
  if (!name) return false;
  if (favChannels[name]) delete favChannels[name];
  else favChannels[name] = 1;
  saveFav();
  return !!favChannels[name];
}

function hasReminder(videoId, start){
  for (var i = 0; i < reminders.length; i++){
    if (reminders[i].videoId === videoId && reminders[i].start === start) return true;
  }
  return false;
}
function addReminder(r){
  if (hasReminder(r.videoId, r.start)) return false;
  reminders.push({
    videoId: r.videoId, title: r.title, channelTitle: r.channelTitle,
    start: r.start, premiere: !!r.premiere, fired: false
  });
  reminders.sort(function(a, b){ return a.start - b.start; });
  saveRem();
  askNotify();
  return true;
}
function removeReminder(videoId, start){
  reminders = reminders.filter(function(r){
    return !(r.videoId === videoId && r.start === start);
  });
  saveRem();
}

function askNotify(){
  if (typeof Notification === 'undefined') return;
  if (Notification.permission === 'default'){
    try { Notification.requestPermission(); } catch (e) { /* 古い実装は無視 */ }
  }
}

var toastTimer = null;
function toast(msg){
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('on');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 4500);
}

function fireReminder(r){
  var msg = 'まもなく ' + hhmm(r.start) + ' 開始：' + r.title;
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted'){
    try { new Notification('視聴予約', { body: msg, tag: r.videoId }); } catch (e) { /* noop */ }
  }
  toast(msg);
}

function checkReminders(){
  var now = Date.now(), changed = false, i;
  for (i = 0; i < reminders.length; i++){
    var r = reminders[i];
    if (r.fired) continue;
    if (now >= r.start - leadMin * 60000 && now < r.start + 900000){
      r.fired = true;
      changed = true;
      fireReminder(r);
    }
  }
  var before = reminders.length;
  /* 開始から1時間過ぎたものは掃除する */
  reminders = reminders.filter(function(x){ return x.start + 3600000 > now; });
  if (reminders.length !== before) changed = true;
  if (changed) saveRem();
}

/* ============================================================
   描画
   ============================================================ */
function render(){
  var grid = document.getElementById('grid');
  var totalPx = Math.round(1440 * pxPerMin);
  var narrow = (typeof window !== 'undefined' && window.innerWidth && window.innerWidth < 760);
  grid.style.gridTemplateColumns =
    'var(--gutter) repeat(' + CH.length + ', minmax(' + (narrow ? 84 : 132) + 'px, 1fr))';
  grid.style.setProperty('--half', Math.round(30 * pxPerMin) + 'px');

  var h = '<div class="corner"></div>';
  CH.forEach(function(c){
    h += '<div class="chh" style="color:' + c.color + '"><b>' + c.no + '</b><i>' + esc(c.name) + '</i></div>';
  });

  /* 時刻の目盛り */
  var g = '', m;
  for (m = 0; m < 1440; m += 30){
    var top = Math.round(m * pxPerMin);
    var isHour = (m % 60 === 0);
    g += '<div class="t' + (isHour ? ' hh' : '') + '" style="top:' + top + 'px">' +
         (isHour ? pad2(m/60) + ':00' : '') + '</div>';
  }
  h += '<div class="gut" id="gut" style="height:' + totalPx + 'px">' + g + '</div>';

  flatBlocks = [];
  CH.forEach(function(c){
    var s = '';
    var list = schedule[c.no] || [];
    for (var i = 0; i < list.length; i++){
      var b = list[i];
      var top = Math.round((b.start - dayStart) / 60000 * pxPerMin);
      var hgt = Math.max(9, Math.round((b.end - b.start) / 60000 * pxPerMin) - 2);
      var idx = flatBlocks.length;
      flatBlocks.push(b);
      b._ch = c.no;

      if (b.filler){
        s += '<div class="blk filler" style="top:' + top + 'px;height:' + hgt + 'px">' +
             '<div class="ti">放送休止</div></div>';
        continue;
      }
      var cls = 'blk' + (hgt < 30 ? ' h1' : (hgt < 52 ? ' h2' : ''));
      var tag = b.live ? '<span class="tag live">LIVE</span>' : '';
      if (b.bundle && b.items.length > 1) tag += '<span class="tag bdl">' + b.items.length + '本</span>';
      if (isFav(b)) tag += '<span class="tag fav">★</span>';
      var vl = viewLabel(b.views);
      var meta = esc(b.channelTitle) + ' / ' + durLabel(b.durSec) +
                 (vl ? ' / ' + vl : '') + (b.truncated ? ' 途中まで' : '');
      s += '<button class="' + cls + '" data-idx="' + idx + '" ' +
           'style="top:' + top + 'px;height:' + hgt + 'px;border-left-color:' + c.color +
           ';background:' + c.color + '22">' +
           '<div class="ti">' + tag + esc(b.title) + '</div>' +
           '<div class="mt">' + meta + '</div></button>';
    }
    s += '<div class="nl" style="display:none"></div>';
    h += '<div class="lane" style="height:' + totalPx + 'px">' + s + '</div>';
  });

  grid.innerHTML = h;
  renderRemote();
  updateNow();
}

function setBtnState(id, on){
  var el = document.getElementById(id);
  if (!el) return;
  if (on) el.classList.add('on'); else el.classList.remove('on');
}

function renderMy(){
  var h = '', i, r, u;

  /* 視聴予約 */
  if (!reminders.length){
    h = '<div class="empty">予約はありません。番組をクリックして「視聴予約」を押すと登録されます。</div>';
  } else {
    for (i = 0; i < reminders.length; i++){
      r = reminders[i];
      h += '<div class="row"><div class="rb"><div class="rt">' +
           (r.premiere ? '<span class="tag pre">プレミア</span>' : '') + esc(r.title) +
           '</div><div class="rs">' + mdhm(r.start) + ' 開始 / ' + esc(r.channelTitle) +

           '" data-st="' + r.start + '">解除</button></div></div>';
    }
  }
  document.getElementById('myRem').innerHTML = h;

  /* プレミア公開・配信予定 */
  h = '';
  if (!upcomingList.length){
    h = '<div class="empty">情報がありません。「番組表を更新」で取得されます。</div>';
  } else {
    for (i = 0; i < upcomingList.length; i++){
      u = upcomingList[i];
      var done = hasReminder(u.videoId, u.start);
      h += '<div class="row"><div class="rb"><div class="rt">' +
           (u.premiere ? '<span class="tag pre">プレミア</span>' : '<span class="tag live">配信予定</span>') +
           esc(u.title) + '</div><div class="rs">' + mdhm(u.start) + ' 開始 / ' + esc(u.channelTitle) +
           (u.premiere && u.durSec ? ' / ' + durLabel(u.durSec) : '') + '</div></div>' +
           '<div class="ra"><button class="btn' + (done ? ' on' : '') + '" data-act="rem" data-idx="' + i +
           '">' + (done ? '予約済み' : '予約') + '</button></div></div>';
    }
  }
  document.getElementById('myUp').innerHTML = h;

  /* お気に入り */
  var ck = Object.keys(favChannels), vk = Object.keys(favVideos);
  h = '';
  if (!ck.length && !vk.length){
    h = '<div class="empty">お気に入りはありません。番組の再生画面から登録できます。</div>';
  } else {
    for (i = 0; i < ck.length; i++){
      h += '<div class="row"><div class="rb"><div class="rt">' + esc(ck[i]) +
           '</div><div class="rs">チャンネル</div></div>' +
           '<div class="ra"><button class="btn" data-act="unfavch" data-name="' + esc(ck[i]) +
           '">解除</button></div></div>';
    }
    for (i = 0; i < vk.length; i++){
      var fv = favVideos[vk[i]];
      h += '<div class="row"><div class="rb"><div class="rt">' + esc(fv.title) +
           '</div><div class="rs">番組 / ' + esc(fv.channelTitle) + '</div></div>' +
           '<div class="ra"><button class="btn" data-act="unfav" data-id="' + esc(vk[i]) +
           '">解除</button></div></div>';
    }
  }
  document.getElementById('myFav').innerHTML = h;

  document.getElementById('fLead').value = leadMin;

  var note = '通知はこのページを開いている間だけ届きます。';
  if (typeof Notification === 'undefined') note += ' このブラウザは通知に対応していません。';
  else if (Notification.permission === 'denied') note += ' 通知がブロックされているため画面内表示のみになります。';
  if (!store.available) note += ' 保存領域が使えないため、設定はページを閉じると消えます。';
  document.getElementById('myNote').textContent = note;
}

function renderRemote(){
  var h = '';
  CH.forEach(function(c){
    var cur = currentBlock(c.no);
    var label = cur ? (cur.filler ? '放送休止' : cur.title) : '-';
    if (label.length > 16) label = label.slice(0, 16) + '…';
    h += '<button class="rbtn" data-ch="' + c.no + '" style="color:' + c.color + '">' +
         '<b>' + c.no + '</b><span style="color:var(--tx2)">' + esc(label) + '</span></button>';
  });
  document.getElementById('remote').innerHTML = h;
}

function currentBlock(chNo, at){
  var now = at || Date.now();
  var list = schedule[chNo] || [];
  for (var i = 0; i < list.length; i++){
    if (list[i].start <= now && now < list[i].end) return list[i];
  }
  return null;
}
function nextBlock(chNo, at){
  var now = at || Date.now();
  var list = schedule[chNo] || [];
  for (var i = 0; i < list.length; i++){ if (list[i].start > now) return list[i]; }
  return null;
}

function updateNow(){
  var now = new Date();
  document.getElementById('clock').firstChild.nodeValue = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  document.getElementById('today').textContent =
    (now.getMonth()+1) + '/' + now.getDate() + ' (' + '日月火水木金土'[now.getDay()] + ')';

  if (!dayStart) return;
  var t = now.getTime();
  if (t < dayStart || t >= dayEnd){
    document.querySelectorAll('.nl').forEach(function(n){ n.style.display = 'none'; });
    return;
  }
  var top = Math.round((t - dayStart) / 60000 * pxPerMin);
  document.querySelectorAll('.lane .nl').forEach(function(n){
    n.style.display = 'block'; n.style.top = top + 'px';
  });
  var gut = document.getElementById('gut');
  if (gut){
    var gl = gut.querySelector('.nl');
    if (!gl){ gl = document.createElement('div'); gl.className = 'nl g'; gut.appendChild(gl); }
    gl.style.top = top + 'px';
    gl.setAttribute('data-t', hhmm(t));
  }
  /* 現在放送中の枠を光らせる */
  document.querySelectorAll('.blk.onair').forEach(function(b){ b.classList.remove('onair'); });
  document.querySelectorAll('.blk[data-idx]').forEach(function(el){
    var b = flatBlocks[+el.getAttribute('data-idx')];
    if (b && b.start <= t && t < b.end) el.classList.add('onair');
  });
}

function scrollToNow(){
  var t = Date.now();
  if (t < dayStart || t >= dayEnd) return;
  var top = (t - dayStart) / 60000 * pxPerMin;
  document.getElementById('epg').scrollTo({ top: Math.max(0, top - 140), behavior: 'smooth' });
}

/* ============================================================
   プレイヤー
   ============================================================ */
window.onYouTubeIframeAPIReady = function(){
  ytReady = true;
  if (pendingPlay){ var p = pendingPlay; pendingPlay = null; play(p.idx, p.fromHead); }
};

function play(idx, fromHead){
  var b = flatBlocks[idx];
  if (!b || !b.videoId) return;
  editingBlockIdx = idx;

  var now = Date.now();

  /* まとめ枠なら、いま放送中の1本を選ぶ */
  var target = b, i;
  if (b.bundle && b.items && b.items.length){
    target = b.items[0];
    for (i = 0; i < b.items.length; i++){
      if (b.items[i].start <= now && now < b.items[i].end) target = b.items[i];
    }
  }
  if (!target.videoId) return;

  var offset = 0;
  if (!fromHead && !b.live && now > target.start && now < target.end){
    offset = Math.floor((now - target.start) / 1000);
    if (offset > target.durSec - 5) offset = 0;
  }

  document.getElementById('pTitle').textContent = target.title;
  var nx = nextBlock(b._ch);
  var vl = viewLabel(target.views);
  document.getElementById('pMeta').innerHTML =
    esc(target.channelTitle) + (vl ? ' ・ ' + vl : '') + ' ・ ' +
    hhmm(target.start) + '〜' + hhmm(target.end) +
    (b.live ? ' ・ <span style="color:#cc3f3f">ライブ配信</span>'
            : ' ・ ' + (offset > 0 ? mmss(offset) + ' から再生中' : '最初から')) +
    (b.bundle && b.items.length > 1
      ? ' ・ まとめ枠 ' + (b.items.indexOf(target) + 1) + '/' + b.items.length : '');
  document.getElementById('pNext').textContent = nx ? '次は ' + hhmm(nx.start) + ' ' + nx.title : '';
  playTarget = target;
  setBtnState('pFav', !!favVideos[target.videoId]);
  setBtnState('pFavCh', !!favChannels[target.channelTitle]);
  var booked = hasReminder(b.videoId, b.start);
  var remBtn = document.getElementById('pRem');
  remBtn.textContent = booked ? '予約済み' : '視聴予約';
  setBtnState('pRem', booked);

  document.getElementById('pErr').classList.remove('on');
  document.getElementById('ovPlay').classList.add('on');

  if (!ytReady && window.YT && YT.Player) ytReady = true;
  if (!ytReady || !window.YT || !YT.Player){ pendingPlay = { idx: idx, fromHead: fromHead }; return; }

  if (!player){
    player = new YT.Player('ytplayer', {
      videoId: target.videoId,
      playerVars: { autoplay: 1, start: offset, playsinline: 1, rel: 0 },
      events: { onError: onPlayerError }
    });
  } else {
    player.loadVideoById({ videoId: target.videoId, startSeconds: offset });
  }
}

function onPlayerError(){
  var e = document.getElementById('pErr');
  e.textContent = 'この動画は埋め込み再生できません。除外リストに報告したので、次回の素材更新から編成に出なくなります。';
  e.classList.add('on');
  var b = flatBlocks[editingBlockIdx];
  if (!b) return;
  var now = Date.now(), vid = b.videoId;
  if (b.bundle && b.items){
    for (var i = 0; i < b.items.length; i++){
      if (b.items[i].start <= now && now < b.items[i].end) vid = b.items[i].videoId;
    }
  }
  if (vid) reportBlocked(vid, 'iframe player error');
}

function closePlayer(){
  document.getElementById('ovPlay').classList.remove('on');
  pendingPlay = null;
  if (player && player.stopVideo) player.stopVideo();
}

function zap(dir){
  if (editingBlockIdx < 0) return;
  var cur = flatBlocks[editingBlockIdx];
  var pos = 0, i;
  for (i = 0; i < CH.length; i++){ if (CH[i].no === cur._ch) pos = i; }
  for (i = 1; i <= CH.length; i++){
    var c = CH[(pos + dir * i + CH.length * CH.length) % CH.length];
    var b = currentBlock(c.no);
    if (b && b.videoId){
      var idx = flatBlocks.indexOf(b);
      if (idx >= 0){ play(idx, false); return; }
    }
  }
}

/* ============================================================
   データ取得
   ============================================================ */
function setStatus(msg, bad){
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (bad ? ' bad' : '');
}

function sbHeaders(){
  return { apikey: cfg.sbKey, Authorization: 'Bearer ' + cfg.sbKey };
}

/* 番組表を読むだけ。YouTube APIはEdge Function側なので、ここからは触らない */
async function loadFromCache(){
  var keys = regionList();
  var url = cfg.sbUrl.replace(/\/$/, '') + '/rest/v1/epg_cache?key=in.(' +
            keys.map(encodeURIComponent).join(',') + ')&select=key,payload,updated_at';
  var r = await fetch(url, { headers: sbHeaders() });
  if (!r.ok) throw new Error('Supabase ' + r.status + ' ' + (await r.text()).slice(0, 160));
  var rows = await r.json();
  if (!rows.length){
    throw new Error('epg_cache に ' + keys.join(', ') + ' の行がありません。Edge Functionでその地域を取得してください。');
  }

  var vids = [], lives = [], upcoming = [], newest = 0, got = {}, i;
  for (i = 0; i < rows.length; i++){
    var pl = rows[i].payload || {};
    got[rows[i].key] = 1;
    vids = vids.concat(pl.vids || []);
    /* 子ども向けはEdge Function側で payload.kids に分けて保存されている */
    (pl.kids || []).forEach(function(k){ k.kids = true; vids.push(k); });
    /* ライブと予定は主地域のものだけ使う */
    if (rows[i].key === cfg.region){
      lives = lives.concat(pl.lives || []);
      upcoming = upcoming.concat(pl.upcoming || []);
    }
    var t = new Date(rows[i].updated_at).getTime();
    if (t > newest) newest = t;
  }
  var missing = keys.filter(function(k){ return !got[k]; });
  return { vids: vids, lives: lives, upcoming: upcoming, updatedAt: newest, missing: missing };
}

/* 再生できなかった動画を報告する。insertのみ許可されたテーブル */
async function reportBlocked(videoId, reason){
  if (!cfg.sbUrl || !cfg.sbKey || !videoId) return;
  try {
    await fetch(cfg.sbUrl.replace(/\/$/, '') + '/rest/v1/blocked_videos', {
      method: 'POST',
      headers: Object.assign(sbHeaders(), {
        'Content-Type': 'application/json',
        Prefer: 'resolution=ignore-duplicates,return=minimal'
      }),
      body: JSON.stringify({ video_id: videoId, reason: reason || 'playback error' })
    });
  } catch (e) { /* 報告失敗は視聴を止める理由にならないので握りつぶす */ }
}

/* 取得済みデータから編成する。初回読み込み・タブ切替・設定変更で共通 */
function rebuildFrom(res){
  var kidsView = cfg.view === 'kids';
  var raw = 0, i;
  for (i = 0; i < res.vids.length; i++){
    if (!!res.vids[i].kids === kidsView) raw++;
  }
  var vids = applyFilters(res.vids);

  if (!vids.length){
    /* 前のタブの番組表が残ると切り替わっていないように見えるので、枠を空にする */
    schedule = {};
    if (!dayStart){ dayStart = startOfDay(new Date()); dayEnd = dayStart + 86400000; }
    render();
    var why;
    if (kidsView){
      why = raw
        ? '子ども向けの動画は ' + raw + '本ありますが、言語の条件に合いませんでした。設定で「選んだ言語の動画だけ表示する」を外してください。'
        : '子ども向けの動画がまだありません。次回のデータ更新をお待ちください。';
    } else {
      why = '条件に合う動画が0件でした（取得 ' + raw + '本）。設定で地域や言語を見直してください。';
    }
    setStatus(why, true);
    return;
  }

  /* キッズでは一般向けのライブ・プレミアを混ぜない */
  var lives = kidsView ? [] : (res.lives || []);
  upcomingList = kidsView ? [] : (res.upcoming || []);
  schedule = buildSchedule(vids, lives, new Date());
  render();
  scrollToNow();

  var msg = '編成完了' + (kidsView ? '（キッズ）' : '') + '：' + regionList().join('+') +
            ' / 動画 ' + vids.length + '本（' + raw + '本から絞り込み）';
  if (!kidsView){
    msg += ' / ライブ ' + lives.length + '本 / プレミア ' + upcomingList.length + '件';
  }
  if (res.updatedAt){
    var age = Math.max(0, Math.round((Date.now() - res.updatedAt) / 60000));
    msg += ' / データ更新は' + (age < 60 ? age + '分前' : Math.floor(age / 60) + '時間前');
  }
  if (res.missing && res.missing.length) msg += ' / 未取得の地域: ' + res.missing.join(', ');
  setStatus(msg, !!(res.missing && res.missing.length));
}

async function loadReal(){
  if (!cfg.sbUrl || !cfg.sbKey){
    setStatus('接続先が設定されていません。', true);
    return;
  }
  var btn = document.getElementById('btnLoad');
  btn.disabled = true;
  setStatus('番組表を読み込んでいます…');
  try {
    var res = await loadFromCache();
    lastRes = res;
    rebuildFrom(res);
  } catch (e){
    setStatus('番組表の取得に失敗しました：' + e.message, true);
  } finally {
    btn.disabled = false;
  }
}

/* ============================================================
   イベント
   ============================================================ */
function renderTabs(){
  var tabs = [['normal', '番組表'], ['kids', 'キッズ']], h = '', i;
  for (i = 0; i < tabs.length; i++){
    h += '<button data-tab="' + tabs[i][0] + '"' +
         (cfg.view === tabs[i][0] ? ' class="on"' : '') + '>' + tabs[i][1] + '</button>';
  }
  document.getElementById('tabs').innerHTML = h;
  document.getElementById('tabnote').textContent =
    cfg.view === 'kids'
      ? 'YouTubeが子ども向けと指定した動画だけで編成しています'
      : '';
}

function renderZoom(){
  var h = '';
  ['粗','標準','細'].forEach(function(lbl, i){
    h += '<button data-z="' + i + '"' + (ZOOMS[i] === pxPerMin ? ' class="on"' : '') + '>' + lbl + '</button>';
  });
  document.getElementById('zoom').innerHTML = h;
}

document.getElementById('zoom').addEventListener('click', function(e){
  var b = e.target.closest('button[data-z]');
  if (!b) return;
  pxPerMin = ZOOMS[+b.getAttribute('data-z')];
  renderZoom();
  if (dayStart){ render(); scrollToNow(); }
});

document.getElementById('grid').addEventListener('click', function(e){
  var b = e.target.closest('.blk[data-idx]');
  if (!b) return;
  var idx = +b.getAttribute('data-idx');
  if (!flatBlocks[idx] || !flatBlocks[idx].videoId) return;
  play(idx, false);
});

document.getElementById('remote').addEventListener('click', function(e){
  var b = e.target.closest('button[data-ch]');
  if (!b) return;
  var cur = currentBlock(+b.getAttribute('data-ch'));
  if (!cur){ return; }
  var idx = flatBlocks.indexOf(cur);
  if (idx >= 0 && cur.videoId) play(idx, false);
  else setStatus('この時間は再生できる番組がありません。');
});

document.getElementById('btnMy').addEventListener('click', function(){
  renderMy();
  document.getElementById('ovMy').classList.add('on');
});
document.getElementById('myClose').addEventListener('click', function(){
  document.getElementById('ovMy').classList.remove('on');
});
document.getElementById('ovMy').addEventListener('click', function(e){
  if (e.target === this) document.getElementById('ovMy').classList.remove('on');
});

document.getElementById('myBody').addEventListener('click', function(e){
  var b = e.target.closest('button[data-act]');
  if (!b) return;
  var act = b.getAttribute('data-act');

  if (act === 'unrem'){
    removeReminder(b.getAttribute('data-id'), +b.getAttribute('data-st'));
  } else if (act === 'rem'){
    var u = upcomingList[+b.getAttribute('data-idx')];
    if (!u) return;
    if (hasReminder(u.videoId, u.start)) removeReminder(u.videoId, u.start);
    else {
      addReminder(u);
      toast('予約しました：' + mdhm(u.start) + ' ' + u.title);
    }
  } else if (act === 'unfav'){
    delete favVideos[b.getAttribute('data-id')];
    saveFav();
  } else if (act === 'unfavch'){
    delete favChannels[b.getAttribute('data-name')];
    saveFav();
  }
  renderMy();
  if (dayStart) render();
});

document.getElementById('fLead').addEventListener('change', function(){
  var v = parseInt(this.value, 10);
  leadMin = (isNaN(v) || v < 0) ? 5 : Math.min(v, 120);
  this.value = leadMin;
  store.set('epg.leadMin', leadMin);
});

document.getElementById('pFav').addEventListener('click', function(){
  if (!playTarget) return;
  var on = toggleFavVideo(playTarget);
  setBtnState('pFav', on);
  toast(on ? 'お気に入りに追加しました' : 'お気に入りを解除しました');
  if (dayStart) render();
});
document.getElementById('pFavCh').addEventListener('click', function(){
  if (!playTarget) return;
  var on = toggleFavChannel(playTarget.channelTitle);
  setBtnState('pFavCh', on);
  toast(on ? esc(playTarget.channelTitle) + ' をお気に入りに追加しました'
           : 'チャンネルのお気に入りを解除しました');
  if (dayStart) render();
});
document.getElementById('pRem').addEventListener('click', function(){
  var b = flatBlocks[editingBlockIdx];
  if (!b) return;
  if (hasReminder(b.videoId, b.start)){
    removeReminder(b.videoId, b.start);
    setBtnState('pRem', false);
    this.textContent = '視聴予約';
    toast('予約を解除しました');
    return;
  }
  if (b.start <= Date.now()){
    toast('この番組はすでに放送中です');
    return;
  }
  addReminder({ videoId: b.videoId, title: b.title, channelTitle: b.channelTitle, start: b.start });
  setBtnState('pRem', true);
  this.textContent = '予約済み';
  toast(hhmm(b.start) + ' に開始します。' + leadMin + '分前に通知します');
});

document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('button[data-tab]');
  if (!b) return;
  var v = b.getAttribute('data-tab');
  if (v === cfg.view) return;
  cfg.view = v;
  store.set('epg.view', v);
  renderTabs();
  if (lastRes) rebuildFrom(lastRes); else loadReal();
});

var resizeTimer = null;
window.addEventListener('resize', function(){
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){ if (dayStart) render(); }, 250);
});

document.getElementById('btnNow').addEventListener('click', scrollToNow);
document.getElementById('btnLoad').addEventListener('click', loadReal);
document.getElementById('pClose').addEventListener('click', closePlayer);
document.getElementById('zPrev').addEventListener('click', function(){ zap(-1); });
document.getElementById('zNext').addEventListener('click', function(){ zap(1); });
document.getElementById('pHead').addEventListener('click', function(){
  if (editingBlockIdx >= 0) play(editingBlockIdx, true);
});
document.getElementById('ovPlay').addEventListener('click', function(e){
  if (e.target === this) closePlayer();
});

document.getElementById('btnSet').addEventListener('click', function(){
  var sel = document.getElementById('fLang'), known = false, oh = '';
  LANGS.forEach(function(l){
    if (l[0] === cfg.lang) known = true;
    oh += '<option value="' + l[0] + '">' + esc(l[1]) + '</option>';
  });
  if (!known) oh = '<option value="' + esc(cfg.lang) + '">' + esc(cfg.lang) + '</option>' + oh;
  sel.innerHTML = oh;
  sel.value = cfg.lang;
  document.getElementById('fRegion').value = cfg.region;
  document.getElementById('fExtra').value = cfg.extraRegions.join(', ');
  document.getElementById('fLangOnly').checked = cfg.langOnly;
  document.getElementById('hRegion').textContent =
    '端末の言語設定からは ' + DEV.country + ' と判定しています。変更できます。';
  document.getElementById('hLang').textContent =
    '動画に言語の指定が無い場合は、タイトルの文字から判定します。';
  document.getElementById('ovSet').classList.add('on');
});
function closeSettings(){
  var before = regionList().join(',') + '|' + cfg.lang + '|' + cfg.langOnly;
  var beforeRegions = regionList().join(',');
  var rg = document.getElementById('fRegion').value.trim().toUpperCase();
  cfg.region = /^[A-Z]{2}$/.test(rg) ? rg : DEV.country;
  cfg.extraRegions = document.getElementById('fExtra').value
    .split(',')
    .map(function(x){ return x.trim().toUpperCase(); })
    .filter(function(x){ return /^[A-Z]{2}$/.test(x) && x !== cfg.region; })
    .slice(0, 5);
  cfg.langOnly = document.getElementById('fLangOnly').checked;
  cfg.lang = document.getElementById('fLang').value || cfg.lang;

  store.set('epg.region', cfg.region);
  store.set('epg.extraRegions', cfg.extraRegions);
  store.set('epg.langOnly', cfg.langOnly);
  store.set('epg.lang', cfg.lang);
  document.getElementById('ovSet').classList.remove('on');

  /* 変更があったときだけ組み直す。地域が変わったら取り直し、言語だけなら手元のデータで再編成 */
  var after = regionList().join(',') + '|' + cfg.lang + '|' + cfg.langOnly;
  if (after === before) return;
  if (regionList().join(',') !== beforeRegions || !lastRes) loadReal();
  else rebuildFrom(lastRes);
}
document.getElementById('sClose').addEventListener('click', closeSettings);
document.getElementById('ovSet').addEventListener('click', function(e){
  if (e.target === this) closeSettings();
});
document.getElementById('ovSet').addEventListener('click', function(e){
  if (e.target === this) document.getElementById('sClose').click();
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    if (document.getElementById('ovPlay').classList.contains('on')) closePlayer();
    else if (document.getElementById('ovMy').classList.contains('on')) document.getElementById('myClose').click();
    else if (document.getElementById('ovSet').classList.contains('on')) document.getElementById('sClose').click();
  }
  if (document.getElementById('ovPlay').classList.contains('on')){
    if (e.key === 'ArrowRight') zap(1);
    if (e.key === 'ArrowLeft') zap(-1);
  }
});

renderZoom();
renderTabs();
updateNow();
checkReminders();
setInterval(function(){ updateNow(); renderRemote(); checkReminders(); }, 30000);
loadReal();
</script>
